<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event name</title>
  <style>
    :root { --bg: #1b1035; --fg: #fff8e7; --accent: #ffcc33; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 30% 20%, #3b1f6e, var(--bg));
      color: var(--fg); text-align: center; padding: 2rem;
    }
    h1 { font-size: clamp(2.5rem, 10vw, 5rem); margin: 0 0 .5rem; color: var(--accent); }
    .when { font-size: 1.25rem; margin: 0 0 2rem; }
    .details { list-style: none; padding: 0; margin: 0 0 2rem; line-height: 2; }
    a.button {
      display: inline-block; padding: .9rem 2rem; border-radius: 999px;
      background: var(--accent); color: var(--bg); font-weight: 700; text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Event name</h1>
    <p class="when">Date · Time</p>
    <ul class="details">
      <li>📍 Place</li>
      <li>👕 Dress code</li>
      <li>🎁 What to bring</li>
    </ul>
    <a class="button" href="#">RSVP</a>
  </main>
</body>
</html>
